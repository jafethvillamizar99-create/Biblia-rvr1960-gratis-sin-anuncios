  "Marcos": "<h3>Biografía — Marcos</h3>\n<p>Autor tradicional: Juan Marcos, compañero de Pedro y Pablo. Fecha estimada: c. 55–65 d.C. Capítulos: 16. Género: Evangelio/narrativa.</p>\n<p>Marcos es el evangelio más breve y probablemente el más antiguo. Su estilo es vívido, rápido y enfocado en la acción. No incluye genealogía ni nacimiento; comienza con el ministerio de Juan el Bautista (1:1–8) y el bautismo de Jesús (1:9–11), seguido de la tentación y el inmediato anuncio del reino: &quot;El tiempo se ha cumplido, y el reino de Dios se ha acercado; arrepentíos, y creed en el evangelio&quot; (1:15). Jesús llama a los primeros discípulos (1:16–20), expulsa un demonio en la sinagoga de Cafarnaúm (1:21–28) y comienza una ronda de curaciones: la suegra de Pedro, leprosos, paralíticos, el endemoniado de Gerasa, la hemorroísa, la hija de Jairo, el ciego de Betsaida.</p>\n<p>Marcos enfatiza el messianic secret (secreto mesiánico): Jesús ordena a los demonios y a los sanados que no revelen su identidad (1:25, 34, 44; 3:12; 5:43; 8:30; 9:9). La mitad del libro se dedica a la última semana en Jerusalén. Los discípulos son retratados con frecuencia como incomprensivos: no entienden las parábolas (4:13), la multiplicación de los panes (6:52), la predicción de la pasión (8:32; 9:32; 10:35–45). La transfiguración (9:2–13) confirma la filiación divina. La entrada en Jerusalén (11:1–11), la limpieza del templo (11:15–19), los debates con los líderes judíos (12:1–44) y el discurso escatológico (13:1–37) preparan la pasión. La última cena (14:12–26), Getsemaní (14:32–42), el arresto (14:43–52), el juicio ante Caifás (14:53–65), la negación de Pedro (14:66–72), la entrega a Pilato (15:1–15), la flagelación, la coronación de espinas, la crucifixión (15:16–41), la muerte a las tres de la tarde con el grito de abandono (&quot;Dios mío, Dios mío, ¿por qué me has desamparado?&quot;, 15:34), la confesión del centurión (15:39), la sepultura de José de Arimatea (15:42–47) y la resurrección narrada brevemente (16:1–8). Los manuscritos incluyen finales alternativos (16:9–20), pero el texto original probablemente termina con el temor de las mujeres.</p>\n<p>Temas clave: Servicio, sufrimiento, secreto mesiánico, discipulado imperfecto, cruz y resurrección.</p>",
  "Lucas": "<h3>Biografía — Lucas</h3>\n<p>Autor tradicional: Lucas, médico y compañero de Pablo. Fecha estimada: c. 60–80 d.C. Capítulos: 24. Género: Evangelio/narrativa.</p>\n<p>Lucas es el evangelio más largo y universal, dirigido a &quot;Teófilo&quot; (1:3). Su prólogo afirma que la narración es el resultado de una investigación cuidadosa. Lucas incluye material único: los nacimientos de Juan el Bautista y Jesús, los cánticos de María (Magnificat, 1:46–55), Zacarías (Benedictus, 1:68–79) y Simeón (Nunc dimittis, 2:29–32). La genealogía (3:23–38) traza a Jesús hasta Adán, enfatizando la universalidad.</p>\n<p>El ministerio de Jesús incluye una fuerte atención a los marginados: la viuda de Nain (7:11–17), la mujer pecadora (7:36–50), las mujeres discípulas (8:1–3), la samaritana (10:25–37), María y Marta (10:38–42), el hijo pródigo (15:11–32), Zaqueo (19:1–10) y el buen ladrón (23:39–43). Las parábolas exclusivas de Lucas son el buen samaritano, el amigo importuno, el mayordomo infiel, el rico y Lázaro, y el juez injusto. El Sermón del Llano (6:17–49) paralelo al Sermón del Monte de Mateo incluye las Bienaventuranzas y los ayes.</p>\n<p>Lucas narra la transfiguración (9:28–36), la última entrada en Jerusalén (19:28–44), la limpieza del templo (19:45–48), los debates con los saduceos, fariseos y escribas (20:1–21:4), y el discurso escatológico (21:5–38). La última cena (22:7–23) incluye la institución de la eucaristía. Getsemaní (22:39–46), la curación de la oreja de Malco (22:50–51), el juicio ante Caifás y Pilato (22:54–23:25), la crucifixión en el Gólgota (23:26–49), el velo rasgado, la confesión del centurión (23:47), la sepultura de José de Arimatea (23:50–56) y la resurrección (24:1–12) se narran con detalle. La aparición en el camino a Emaús (24:13–35) y la ascensión desde el monte de los Olivos (24:50–53) cierran el evangelio. Lucas escribió también Hechos, formando una obra bipartita.</p>\n<p>Temas clave: Salvación universal, Espíritu Santo, mujeres, pobres, perdón, historia de la salvación y ascensión.</p>",
  "Juan": "<h3>Biografía — Juan</h3>\n<p>Autor tradicional: Juan, el discípulo amado. Fecha estimada: c. 80–95 d.C. Capítulos: 21. Género: Evangelio/teológico.</p>\n<p>Juan es el evangelio más teológico y diferente en estructura de los sinópticos. No contiene parábolas (sino &quot;señales&quot; y discursos largos), ni exorcismos, ni institución de la eucaristía en la última cena. El prólogo (1:1–18) es el texto cristológico más elevado del Nuevo Testamento: &quot;En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios... Y el Verbo se hizo carne, y habitó entre nosotros&quot; (1:1, 14). Identifica a Jesús como el Logos (logos), la luz, la vida y la única exposición del Padre.</p>\n<p>El ministerio de Jesús se organiza alrededor de siete señales: la conversión del agua en vino en Caná (2:1–12), la curación del hijo del oficial en Cafarnaúm (4:46–54), la curación del paralítico en Betesda (5:1–18), la multiplicación de los panes (6:1–14), la caminata sobre el mar (6:15–21), la curación del ciego de nacimiento (9:1–41) y la resurrección de Lázaro (11:1–45). Cada señal es seguida de un discurso teológico que interpreta su significado: el templo del cuerpo (2:19–22), el nacimiento del espíritu (3:1–21), la fuente de agua viva (4:1–26), el pan de vida (6:25–59), la luz del mundo (8:12–9:41), el buen pastor (10:1–21) y la resurrección y la vida (11:17–27). Juan incluye las &quot;Yo soy&quot; (egō eimi) reveladoras: el pan de vida (6:35), la luz del mundo (8:12), la puerta de las ovejas (10:7), el buen pastor (10:11, 14), la resurrección y la vida (11:25), el camino, la verdad y la vida (14:6), y la vid verdadera (15:1).</p>\n<p>La última cena (caps. 13–17) es extensa: el lavatorio de los pies (13:1–20), la identificación del traidor (13:21–30), los discursos de despedida (14:1–16:33) y la oración sacerdotal (17:1–26), donde Jesús intercede por la unidad de los creyentes. La pasión (caps. 18–19) incluye el arresto en el huerto, la negación de Pedro, el juicio ante Anás, Caifás y Pilato, la escena de Ecce Homo (19:5), la crucifixión en el Pretorio, la entrega de la madre de Jesús a Juan (19:26–27), la sed, la muerte, la lanza que perfora el costado, y la sepultura en el huerto de José de Arimatea. La resurrección (caps. 20–21) presenta a Jesús ante María Magdalena (20:11–18), a los discípulos en el cenáculo (20:19–23), a Tomás que toca las heridas (20:24–29), y en la aparición en el mar de Tiberias (21:1–25), con la rehabilitación de Pedro. El propósito del evangelio se declara explícitamente: &quot;para que creáis que Jesús es el Cristo, el Hijo de Dios, y para que creyendo, tengáis vida en su nombre&quot; (20:31).</p>\n<p>Temas clave: Deidad de Cristo, Logos, señales, Espíritu Santo, vida eterna, unidad y amor.</p>",
  "Hechos": "<h3>Biografía — Hechos</h3>\n<p>Autor tradicional: Lucas. Fecha estimada: c. 62–90 d.C. Capítulos: 28. Género: Historia/narrativa.</p>\n<p>Hechos es la continuación de Lucas y narra la expansión del cristianismo desde Jerusalén hasta Roma. La estructura sigue el mandato de 1:8: &quot;Seréis mis testigos en Jerusalén, en toda Judea y Samaria, y hasta lo último de la tierra&quot;. El capítulo 1 registra la ascensión y la elección de Matías como apóstol. Pentecostés (cap. 2) describe la venida del Espíritu Santo con viento, lenguas como de fuego y el don de lenguas, seguido del sermón de Pedro a los judíos, donde 3.000 personas se bautizan. La iglesia primitiva comparte bienes, celebra la eucaristía y crece (2:42–47; 4:32–37).</p>\n<p>Los milagros de los apóstoles incluyen la curación del cojo en la puerta Hermosa (3:1–10), la predicación ante el Sanedrín (4:1–22; 5:17–42), la muerte de Ananías y Safira (5:1–11), la elección de los diáconos (6:1–7), el martirio de Esteban (7:54–8:3) y la expansión a Samaria por Felipe (8:4–25). La conversión de Saulo (Pablo) en el camino de Damasco (9:1–19) es central. Pedro visita a Cornelio, el primer gentil convertido (10:1–11:18), y el concilio de Jerusalén (15:1–35) decide que los gentiles no necesitan circuncisión. La segunda mitad del libro (caps. 13–28) sigue los viajes misioneros de Pablo. Primero viaje (13–14): Chipre, Antioquía de Pisidia, Iconio, Listra (donde Pablo es apedreado y dejado por muerto). Segundo viaje (15:36–18:22): Filipos (conversión de Lidia y la cárcel), Tesalónica, Berea, Atenas (discurso en el Areópago), Corinto (18 meses). Tercer viaje (18:23–21:16): Éfeso (dos años, disturbio de los plateros), Macedonia, Grecia, Troas (resurrección de Eutico).</p>\n<p>Pablo regresa a Jerusalén, es arrestado en el templo (21:27–36), defendido ante la multitud (22:1–22), el Sanedrín (23:1–10) y el gobernador Félix (24:1–27). Félix lo deja en prisión dos años; Festo lo sucede. Pablo apela a César (25:1–12). El viaje a Roma (27:1–28:16) incluye el naufragio en Malta, la mordedura de la víbora y las curaciones en Publius. Pablo llega a Roma, alquila una casa y predica durante dos años &quot;a todos los que venían a él&quot; (28:30–31). Hechos termina abruptamente, posiblemente esperando el juicio de Pablo o la parusía.</p>\n<p>Temas clave: Espíritu Santo, testimonio, expansión misionera, iglesia, judíos y gentiles, martirio y justicia romana.</p>",
  "Romanos": "<h3>Biografía — Romanos</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 56–57 d.C. Capítulos: 16. Género: Epístola doctrinal.</p>\n<p>Romanos es la obra teológica más sistemática de Pablo. Escrita desde Corinto durante su tercer viaje, destinada a la iglesia de Roma que Pablo aún no había visitado. El propósito es exponer el evangelio en su plenitud teológica: &quot;Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego&quot; (1:16). La estructura sigue una progresión lógica: pecado universal (1:18–3:20), justificación por la fe (3:21–5:21), santificación (6:1–8:39), el destino de Israel (9–11), y ética cristiana (12–16).</p>\n<p>Los capítulos 1–3 demuestran que todos, judíos y gentiles, están bajo pecado. La ley no justifica, sino que condena (3:20). La justificación es gratuita por gracia mediante la fe en Cristo (3:21–26). La fe de Abraham (4:1–25) es el paradigma: creó contra toda esperanza. La paz con Dios (5:1–11) y la entrada del pecado por Adán con la redención por Cristo (5:12–21) establecen la antropología y cristológía. Los capítulos 6–8 tratan la vida nueva: la muerte al pecado, la liberación de la ley, el conflicto interno del creyente (7:14–25) y la glorificación de la vida en el Espíritu (8:1–39). El capítulo 8 es la cumbre de la esperanza: la creación gime, Dios intercede, y nada puede separar del amor de Dios en Cristo (8:38–39).</p>\n<p>Los capítulos 9–11 responden a la pregunta de Israel: ¿ha fracasado la palabra de Dios? Pablo afirma la soberanía divina en la elección, el endurecimiento de Faraón, y el remanente de gracia. Israel tropezó en la piedra de tropiezo (9:32). La inclusión de los gentiles provocará la envidia de Israel (11:11–14). &quot;Porque de él, y por él, y para él, son todas las cosas&quot; (11:36). Los capítulos 12–15 son la aplicación ética: transformación por la renovación de la mente (12:1–2), servicio en el cuerpo, amor al prójimo, sometimiento a las autoridades, y consideración de los débiles en la libertad cristiana. El capítulo 16 saluda a numerosos individuos, incluyendo a Febe, diaconisa, y a Andronico y Junia, destacados entre los apóstoles. La doxología final (16:25–27) glorifica al Dios que puede establecer según el evangelio de Jesucristo.</p>\n<p>Temas clave: Justificación por fe, gracia, pecado, ley, Espíritu, Israel, ética cristiana y doxología.</p>",
  "1 Corintios": "<h3>Biografía — 1 Corintios</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 53–54 d.C. Capítulos: 16. Género: Epístola pastoral/correctiva.</p>\n<p>1 Corintios es una respuesta a los problemas de una iglesia urbana próspera pero dividida. Pablo aborda divisiones, moralidad, litigios, matrimonio, libertad cristiana, adoración y resurrección. Los capítulos 1–4 tratan las divisiones: algunos se identifican con Pablo, Apolos, Cefas o Cristo. Pablo denuncia el orgullo intelectual griego: &quot;Dios escogió lo necio del mundo para avergonzar a los sabios&quot; (1:27). El mensaje de la cruz es locura para los gentiles y escándalo para los judíos, pero poder de Dios para los salvados (1:18–25). Los capítulos 5–6 abordan el incesto (un hombre con la mujer de su padre), la tolerancia del pueblo y los litigios ante tribunales paganos. &quot;¿O no sabéis que los santos han de juzgar al mundo?&quot; (6:2).</p>\n<p>El capítulo 7 trata el matrimonio, el celibato, la relación entre esposos, el divorcio, los matrimonios mixtos y la virginidad. Los capítulos 8–10 tratan la libertad cristiana y los alimentos sacrificados a ídolos: el conocimiento se hincha, pero el amor edifica (8:1). Pablo renuncia a sus derechos como apóstol (9:1–27) para ganar a más. El capítulo 10 usa el exodo como advertencia: los israelitas comieron el mismo maná espiritual, pero Dios no se complació en muchos de ellos (10:1–5). Los capítulos 11–14 regulan la adoración: la cabeza de la mujer (11:3–16), la cena del Señor (11:17–34), los dones espirituales (12:1–31), el cuerpo de Cristo con diversos miembros, el amor como camino más excelente (13:1–13), y el uso de lenguas y profecía en la asamblea (14:1–40). La mujer debe guardar silencio en la iglesia (14:34–35), texto muy debatido. El capítulo 15 es la catequesis más extensa sobre la resurrección: si no hay resurrección, la fe es vana (15:14). Cristo resucitó como primicias, seguido de los que durmieron en él. La resurrección del cuerpo es transformación de corruptible a incorruptible, mortal a inmortal (15:50–57). La victoria final es: &quot;Donde está, oh muerte, tu aguijón?&quot; (15:55). La colecta para los santos de Jerusalén (16:1–4) y los saludos (16:5–24) cierran la carta.</p>\n<p>Temas clave: Unidad, cruz, moralidad, libertad, amor, dones espirituales, resurrección y colecta.</p>",
  "2 Corintios": "<h3>Biografía — 2 Corintios</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 55–56 d.C. Capítulos: 13. Género: Epístola autobiográfica/apologética.</p>\n<p>2 Corintios es una defensa del ministerio de Pablo contra los &quot;superapóstoles&quot; (falsos maestros que lo acusan de debilidad). Los capítulos 1–2 son consolatorios, explicando los cambios de itinerario y la reconciliación con el ofensor del capítulo 5 de 1 Corintios. Pablo describe su sufrimiento en Asia (1:8–11) como una carga mortal que enseñó a confiar en Dios. El capítulo 2:14–17 presenta al creyente como fragancia de Cristo: aroma de vida para los salvados, de muerte para los condenados.</p>\n<p>Los capítulos 3–5 son teológicos. El capítulo 3 contrasta el ministerio de la letra (Moisés con velo) y el ministerio del Espíritu (velo quitado en Cristo, 3:14–18). El capítulo 4 describe el tesoro en vasos de barro para que la excelencia del poder sea de Dios (4:7). La aflicción leve produce un peso eterno de gloria (4:17). El capítulo 5 enseña que la ausencia del cuerpo es presencia con el Señor (5:8), y presenta el ministerio de la reconciliación: &quot;Dios estaba en Cristo reconciliando consigo al mundo... Nos encargó a nosotros el ministerio de la reconciliación&quot; (5:19). La nueva creación en Cristo (5:17) y la imputación de la justicia (5:21) son fundamentales.</p>\n<p>Los capítulos 6–7 son exhortaciones a no recibir la gracia en vano (6:1), a separarse de los incrédulos (6:14–7:1) y a la alegría por el arrepentimiento de los corintios. Los capítulos 8–9 tratan la colecta para los pobres de Jerusalén, exaltando la generosidad de las iglesias de Macedonia (8:1–5) y la gracia de dar (9:6–15). Los capítulos 10–12 son la apologética más intensa: Pablo defiende su autoridad, su debilidad y sus visiones. &quot;El que se gloría, gloríese en el Señor&quot; (10:17). El capítulo 11 presenta la litote sarcástica: aunque sea insensato, Pablo compara su sufrimiento (azotes, naufragios, peligros, hambre, frío) con los &quot;superapóstoles&quot;. El capítulo 12 describe el éxtasis al paraíso (tercer cielo, 12:2–4) y la espina en la carne (12:7–10), para que el poder de Cristo resplandezca en su debilidad. La advertencia final (13:1–10) incluye la cita de Deuteronomio 19:15 sobre dos o tres testigos y la bendición final de la Trinidad (13:14).</p>\n<p>Temas clave: Reconciliación, debilidad y poder, ministerio, generosidad, visión, suficiente gracia y Trinidad.</p>",
  "Gálatas": "<h3>Biografía — Gálatas</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 48–55 d.C. Capítulos: 6. Género: Epístola doctrinal/polemica.</p>\n<p>Gálatas es la carta más apasionada y breve de Pablo. Su propósito es combatir a los judaizantes que exigen la circuncisión para la salvación. Pablo defiende la justificación por fe sin obras de la ley. El capítulo 1 es autobiográfico: la autoridad de Pablo proviene directamente de Jesucristo, no de los apóstoles de Jerusalén. Su visita a Jerusalén tres años después de su conversión fue breve y consultiva; no recibió instrucción de Pedro (1:18–19). El capítulo 2 narra el incidente de Antioquía, donde Pablo reprendió a Pedro por apartarse de los gentiles por temor a los de la circuncisión (2:11–14). La tesis central se declara en 2:16–21: &quot;Sabiendo que el hombre no es justificado por las obras de la ley, sino por la fe de Jesucristo... porque por las obras de la ley ninguna carne será justificada&quot; (2:16). Pablo ha muerto a la ley para vivir para Dios en Cristo; &quot;no desecho la gracia de Dios, porque si por la ley viene la justicia, entonces por demás murió Cristo&quot; (2:21).</p>\n<p>El capítulo 3 argumenta que la promesa a Abraham precedió a la ley por 430 años y que la ley fue un pedagogo hasta Cristo (3:24–25). La fe en Cristo Jesús hace hijos de Abraham y herederos según la promesa (3:26–29). El capítulo 4 usa la alegoría de Agar y Sara, de Ismael e Isaac: los hijos de la esclava son por la ley, los de la libre por la promesa. &quot;Por tanto, hermanos, no somos hijos de la esclava, sino de la libre&quot; (4:31). El capítulo 5 exhorta a la libertad cristiana: &quot;Cristo nos libertó para que tuviésemos libertad; estad, pues, firmes, y no os sometáis otra vez al yugo de esclavitud&quot; (5:1). El fruto del Espíritu (5:22–23) contrasta con las obras de la carne (5:19–21). El capítulo 6 cierra con la ley de Cristo (cargar los unos con las cargas de los otros), la siembra y cosecha, y la gloriación en la cruz de Cristo (6:14).</p>\n<p>Temas clave: Justificación por fe, libertad cristiana, ley vs. promesa, fruto del Espíritu y nueva creación.</p>",
  "Efesios": "<h3>Biografía — Efesios</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 60–62 d.C. Capítulos: 6. Género: Epístola doctrinal/étnica.</p>\n<p>Efesios es una carta de prisión, posiblemente escrita desde Roma. La primera mitad (caps. 1–3) es teológica; la segunda (caps. 4–6) es práctica. El capítulo 1 es una benedición sobre la elección predestinada en Cristo antes de la fundación del mundo (1:4), la redención por su sangre, el sellado del Espíritu Santo como garantía de la herencia (1:13–14), y la oración de que los ojos del entendimiento sean iluminados para conocer la esperanza del llamamiento, la gloria de la herencia y la supereminente grandeza del poder de Dios (1:15–23). El capítulo 2 enseña la muerte por pecado y la vida por gracia: &quot;Porque por gracia sois salvos por medio de la fe... no por obras, para que nadie se gloríe&quot; (2:8–9). La paz entre judíos y gentiles en un solo cuerpo (2:11–22) es la reconciliación horizontal y vertical; Cristo es nuestra paz, y el muro de separación (el muro de las lamentaciones) ha sido derribado.</p>\n<p>El capítulo 3 revela el misterio: que los gentiles son coherederos, miembros del mismo cuerpo, y copartícipes de la promesa en Cristo por el evangelio (3:6). La oración por el conocimiento del amor de Cristo que excede a todo conocimiento (3:14–19) conduce a la doxología de la gloria en la iglesia (3:20–21). El capítulo 4 insta a la unidad del cuerpo: &quot;Un solo cuerpo, un solo Espíritu... un Señor, una fe, un bautismo&quot; (4:4–6). Los ministerios (apóstoles, profetas, evangelistas, pastores y maestros) edifican el cuerpo hasta la madureza (4:11–16). La conducta nueva incluye la verdad, el control de la ira, el trabajo, la edificación con las palabras, la bondad, el perdón y la imitación de Dios (4:17–5:2). El capítulo 5 trata la conducta en la familia: esposos y esposas (como Cristo y la iglesia), hijos y padres, siervos y amos. El capítulo 6 exhorta a los hijos, padres, siervos y amos, y concluye con la descripción de la armadura de Dios: cinturón de la verdad, coraza de justicia, calzado del evangelio de la paz, escudo de la fe, yelmo de la salvación, espada del Espíritu (palabra de Dios) y la oración constante (6:10–20). La carta finaliza con la mención de Tíquico (6:21–22) y la bendición de la paz.</p>\n<p>Temas clave: Unidad de la iglesia, misterio de los gentiles, gracia, nueva vida, familia cristiana y armadura espiritual.</p>",
  "Filipenses": "<h3>Biografía — Filipenses</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 60–62 d.C. Capítulos: 4. Género: Epístola pastoral/íntima.</p>\n<p>Filipenses es la carta más personal y gozosa de Pablo, escrita desde la prisión en Roma. La iglesia de Filipos, fundada en la segunda visita misionera (Hechos 16), fue generosa en su apoyo financiero. El capítulo 1 expresa la gratitud por la participación en el evangelio desde el primer día (1:5). La oración por el crecimiento en amor y discernimiento (1:9–11) conduce a la reflexión sobre el avance del evangelio aunque Pablo esté preso (1:12–14). El dilema entre vivir (fructificar) y morir (estar con Cristo) es resuelto con la preferencia por la partida, pero la utilidad para la iglesia le inclina a permanecer (1:21–26). La exhortación a la humildad (1:27–2:4) cita el himno cristológico de 2:5–11.</p>\n<p>El himno de Filipenses 2:6–11 es la descripción más profunda de la kenosis: Cristo, siendo en forma de Dios, no consideró el ser igual a Dios como algo a que aferrarse, sino que se despojó a sí mismo, tomando forma de siervo, humillándose hasta la muerte en cruz. Por esto Dios lo exaltó y le dio el nombre sobre todo nombre, para que toda rodilla se doble y toda lengua confiese que Jesucristo es Señor. Los capítulos 2:12–18 exhortan a la obediencia con temor y temblor, &quot;porque Dios es el que en vosotros produce el querer como el hacer, por su buena voluntad&quot; (2:13). El envío de Timoteo y Epafrodito (2:19–30) demuestra la amistad. El capítulo 3 es autobiográfico y polémico: Pablo rechaza la confianza en la carne (circuncisión, linaje benjaminita, fariseo, perseguidor de la iglesia). &quot;Pero lo que para mí era ganancia, lo he estimado como pérdida por amor de Cristo&quot; (3:7). Su meta es conocer a Cristo, la virtud de su resurrección, la participación en sus padecimientos, y ser hallado en él, no con mi propia justicia por la ley, sino por la fe de Cristo (3:8–9). La llamada hacia el premio (3:12–16) y la ciudadanía en el cielo (3:20) anticipan la transformación del cuerpo de humillación a la conformidad con el cuerpo de gloria de Cristo (3:21). El capítulo 4 exhorta a la alegría, la oración con acción de gracias, la paz de Dios que sobrepasa todo entendimiento (4:6–7), y el pensamiento en lo verdadero, honesto, justo, puro, amable, de buen nombre, virtuoso y loable (4:8). La carta cierra con el agradecimiento por el apoyo financiero y la promesa de que Dios suplirá toda necesidad según sus riquezas en gloria en Cristo Jesús (4:19).</p>\n<p>Temas clave: Alegría, kenosis, humildad, justicia por fe, ciudadanía celestial, provisión y paz.</p>",
  "Colosenses": "<h3>Biografía — Colosenses</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 60–62 d.C. Capítulos: 4. Género: Epístola doctrinal/polemica.</p>\n<p>Colosenses combina elevada cristológía con advertencia contra el gnosticismo y la filosofía humana. El capítulo 1 presenta la preeminencia de Cristo: &quot;El cual es la imagen del Dios invisible, el primogénito de toda la creación; porque en él fueron creadas todas las cosas... visibles e invisibles, sean tronos, sean dominios, sean principados, sean potestades; todo fue creado por medio de él y para él&quot; (1:15–16). Cristo es la cabeza del cuerpo, la iglesia (1:18), y la plenitud de la Deidad habita corporalmente en él (2:9). La reconciliación mediante la sangre de su cruz (1:20) aplica a todos los creyentes, quienes son trasladados del reino de las tinieblas al reino del Hijo (1:13). La oración de Pablo (1:9–14) busca el conocimiento de la voluntad de Dios.</p>\n<p>El capítulo 2 combate la filosofía, el ascetismo y la adoración de ángeles. &quot;Mirad que nadie os engañe por medio de filosofías y vanas sutilezas, según las tradiciones de los hombres, conforme a los rudimentos del mundo, y no según Cristo&quot; (2:8). En Cristo están escondidos todos los tesoros de la sabiduría y la ciencia (2:3). La circuncisión espiritual (2:11), el bautismo como sepultura y resurrección con él (2:12), y la cancelación de la deuda de los mandamientos (2:14) son fundamentos. &quot;Despojó a los principados y a las potestades, y los exhibió públicamente, triunfando sobre ellos en la cruz&quot; (2:15). Los capítulos 3–4 son éticos: buscar las cosas de arriba (3:1–4), matar la fornicación, impureza, avaricia, ira, maldad y mentira. Vestir el nuevo hombre con entrañas de misericordia, bondad, humildad, mansedumbre, paciencia y sobre todo amor (3:12–14). La paz de Cristo arbitre en el corazón y la palabra de Cristo habite abundantemente (3:15–16). Las instrucciones para el hogar (3:18–4:1) y la oración perseverante (4:2–4) cierran la carta. Los saludos incluyen a Onésimo, el esclavo fugitivo convertido, y a Tíquico.</p>\n<p>Temas clave: Preeminencia de Cristo, creación, plenitud, reconciliación, triunfo sobre potestades, nueva vida y oración.</p>",
  "1 Tesalonicenses": "<h3>Biografía — 1 Tesalonicenses</h3>\n<p>Autor tradicional: Pablo, Silvano y Timoteo. Fecha estimada: c. 50–51 d.C. Capítulos: 5. Género: Epístola pastoral/escatológica.</p>\n<p>1 Tesalonicenses es la carta más antigua del Nuevo Testamento. Pablo escribe a la iglesia fundada en la segunda visita misionera (Hechos 17). El capítulo 1 agradece la fe, amor y esperanza de los tesalonicenses, notando que ellos se convirtieron de los ídolos para servir al Dios vivo y esperar la venida de su Hijo desde los cielos (1:9–10). El capítulo 2 defiende la integridad del ministerio de Pablo: no fue con engaño, codicia ni adulación, sino como una nodriza que amamanta a sus hijos (2:7). La oposición de los judíos en Tesalónica se describe con amargura (2:14–16). El capítulo 3 narra la angustia de Pablo por no poder visitar, enviando a Timoteo para fortalecerlos. El capítulo 4 es la catequesis más extensa sobre la parusía en el Nuevo Testamento: los que durmieron en Jesús resucitarán primero, y los que vivimos seremos arrebatados juntamente con ellos en las nubes para recibir al Señor en el aire (4:13–18). Este texto es la base de la doctrina del arrebatamiento. El capítulo 5 exhorta a la vigilancia, porque el día del Señor vendrá como ladrón en la noche. Los creyentes no son de tinieblas sino de luz; vistan la coraza de fe y amor, y el yelmo de la esperanza de la salvación (5:8). La oración final pide la santificación completa del espíritu, alma y cuerpo (5:23). La paz de Dios sea con todos.</p>\n<p>Temas clave: Parusía, resurrección, arrebatamiento, ministerio, esperanza, santificación y vigilancia.</p>",
  "2 Tesalonicenses": "<h3>Biografía — 2 Tesalonicenses</h3>\n<p>Autor tradicional: Pablo, Silvano y Timoteo. Fecha estimada: c. 51–52 d.C. Capítulos: 3. Género: Epístola pastoral/escatológica.</p>\n<p>2 Tesalonicenses corrige malentendidos sobre el día del Señor. Algunos creyentes habían dejado de trabajar, pensando que la parusía era inminente. El capítulo 1 describe la venida de Cristo en gloria con sus ángeles poderosos, en llamas de fuego, para venganza contra los que no conocieron a Dios ni obedecieron al evangelio (1:6–8). El capítulo 2 trata la &quot;apostasía&quot; (apostasía) y la revelación del &quot;hombre de pecado&quot;, el &quot;hijo de perdición&quot;, que se sienta en el templo de Dios como si fuera Dios (2:3–4). Pablo recuerda que había hablado de esto cuando estaba con ellos. El misterio de la iniquidad ya actúa, pero hay un katechon (retenedor) que lo retiene. Cuando el que lo retiene sea quitado, entonces será revelado el inicuo. El Señor Jesús lo destruirá con el espíritu de su boca y con el resplandor de su venida (2:8). La actividad de Satanás con señales, prodigios y engaños injustos (2:9–10) condena a los que no recibieron el amor de la verdad. El capítulo 3 exhorta a la oración y al trabajo. La disciplina de los ociosos es severa: &quot;Si alguno no quiere trabajar, tampoco coma&quot; (3:10). Pablo renuncia a los que andan desordenadamente, con toda confianza en la obediencia de los tesalonicenses.</p>\n<p>Temas clave: Parusía, apostasía, hombre de pecado, retenedor, disciplina, trabajo y oración.</p>",
  "1 Timoteo": "<h3>Biografía — 1 Timoteo</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 62–64 d.C. Capítulos: 6. Género: Epístola pastoral.</p>\n<p>1 Timoteo es una carta de instrucciones para el liderazgo de la iglesia. Timoteo es un joven discípulo de Pablo a quien se le encarga la iglesia de Éfeso. El capítulo 1 advierte contra las fábulas y genealogías interminables que generan contiendas. La ley es buena si se usa legítimamente: para los injustos, insubordinados, impíos, pecadores, etc. La gracia de Dios se manifestó salvando a Pablo, el principal de los pecadores (1:15). El capítulo 2 instruye sobre la oración pública por los gobernantes, para que vivamos en toda piedad y honestidad (2:1–2). Dios quiere que todos los hombres se salven y vengan al conocimiento de la verdad (2:4). Hay un solo mediador entre Dios y los hombres: Cristo Jesús, hombre, que se dio a sí mismo en rescate por todos (2:5–6). La instrucción a las mujeres incluye vestirse con modestia, aprender en silencio con toda sujeción, y no enseñar ni ejercer dominio sobre el hombre (2:9–15), un texto debatido sobre el authentein.</p>\n<p>El capítulo 3 describe los requisitos para los obispos (epískopos) y diáconos: irrepreensibles, marido de una sola mujer, sobrios, prudentes, de buena conducta, hospitalarios, aptos para enseñar, no dados al vino, no contenciosos, gobernantes de sus propias casas, no codiciosos. Los diáconos deben ser probados primero. El capítulo 4 predice la apostasía posterior, con prohibiciones de casarse y de comer alimentos que Dios creó para que se reciban con acción de gracias (4:1–5). Timoteo debe ejercitarse en la piedad, que tiene promesa para la vida presente y la venidera (4:8). El capítulo 5 instruye sobre el trato a los ancianos (honrarlos como a padres), a las viudas (las que son de verdad, sin familia, piadosas, de edad avanzada), y la disciplina de los presbíteros (5:17–25). No recibas acusación contra un anciano sino con dos o tres testigos. El capítulo 6 trata a los siervos, los falsos maestros codiciosos, y la raíz de todos los males: el amor al dinero (6:10). &quot;Lucha la buena batalla de la fe, echa mano de la vida eterna&quot; (6:12). La confesión ante Pilato es testimonio (6:13). La doxología final (6:15–16) describe al único soberano, Rey de reyes y Señor de señores, inmortal, que habita en luz inaccesible.</p>\n<p>Temas clave: Liderazgo eclesial, oración, mediación, gracia, apostasía, piedad, disciplina y riquezas.</p>",
  "2 Timoteo": "<h3>Biografía — 2 Timoteo</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 66–67 d.C. Capítulos: 4. Género: Epístola pastoral/testamento.</p>\n<p>2 Timoteo es el testamento espiritual de Pablo, escrito probablemente desde la segunda prisión en Roma, poco antes de su martirio. El capítulo 1 agradece la fe sincera de Timoteo, heredada de su madre Eunice y su abuela Loida (1:5). Pablo exhorta a no avergonzarse del testimonio de Cristo ni de él, preso, sino a participar en las aflicciones del evangelio según el poder de Dios (1:8). Dios nos salvó y llamó con santo llamamiento, no conforme a nuestras obras, sino según su propósito y gracia (1:9). Pablo está preso, pero la palabra de Dios no está presa (2:9). El capítulo 2 es una serie de imágenes: el hijo del soldado, el atleta, el labrador, el obrero que no tiene de qué avergonzarse, el vaso de honra, y la casa donde hay vasos de oro y de barro. El capítulo 3 predice los tiempos peligrosos de los últimos días: hombres amadores de sí mismos, avaros, jactanciosos, soberbios, blasfemos, desobedientes a los padres, ingratos, impíos, sin afecto natural, implacables, calumniadores, intemperantes, crueles, aborrecedores de lo bueno, traidores, impetuosos, infatuados, amadores de los deleites más que de Dios, y apariencia de piedad pero negando la eficacia de ella (3:1–5). Timoteo debe perseverar en lo que aprendió y fue persuadido, sabiendo de quién lo aprendió (3:14). &quot;Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia, a fin de que el hombre de Dios sea perfecto, enteramente preparado para toda buena obra&quot; (3:16–17). Este es el texto clásico sobre la inspiración bíblica.</p>\n<p>El capítulo 4 es la carga final: &quot;Te encarezco delante de Dios y de Jesucristo, que juzgará a los vivos y a los muertos en su manifestación y en su reino, que prediques la palabra; que instes a tiempo y fuera de tiempo; redarguye, reprende, exhorta con toda paciencia y doctrina&quot; (4:1–2). La gente no soportará la sana doctrina, sino que amontonará maestros conforme a sus propias concupiscencias, y apartará los oídos de la verdad para volverse a las fábulas (4:3–4). Pablo declara su vida cumplida: &quot;He peleado la buena batalla, he acabado la carrera, he guardado la fe. Por lo demás, me está guardada la corona de justicia, la cual me dará el Señor, juez justo, en aquel día; y no sólo a mí, sino también a todos los que aman su venida&quot; (4:7–8). La solicitud de que Timoteo traiga el capote y los libros, especialmente los pergaminos (4:13), y la advertencia sobre Alejandro el calderero (4:14–15) son detalles autobiográficos conmovedores. La soledad de Pablo: &quot;Todos me desampararon&quot; (4:16), excepto Lucas. El Señor estuvo con él y lo libró de toda mala obra (4:17–18). La carta cierra con saludos y la gracia.</p>\n<p>Temas clave: Martirio, perseverancia, inspiración de la Escritura, predicación, apostasía y corona de justicia.</p>",
  "Tito": "<h3>Biografía — Tito</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 62–64 d.C. Capítulos: 3. Género: Epístola pastoral.</p>\n<p>Tito es una carta breve sobre el orden eclesial y la gracia en Creta. Pablo dejó a Tito en Creta para organizar las iglesias y designar ancianos (1:5). Los requisitos de los ancianos (epískopos) se repiten: irrepreensibles, marido de una sola mujer, hijos creyentes, no acusados de disolución ni de rebeldía. Deben ser aptos para exhortar en la sana doctrina y convencer a los que contradicen (1:9). Creta es famosa por sus mentirosos, bestias malas y glotones ociosos (1:12), citando a un profeta cretense. Los capítulos 2–3 son instrucciones éticas: los ancianos deben ser sobrios, graves, prudentes, sanos en fe, amor y paciencia; las ancianas deben ser reverentes, no calumniadoras, no enseñadoras del vino; las jóvenes deben amar a sus maridos y a sus hijos; los jóvenes deben ser sobrios; los siervos obedientes. Todo esto para que la palabra de Dios no sea blasfemada (2:5, 8, 10). La gracia de Dios se ha manifestado para salvación a todos los hombres, enseñándonos a renunciar a la impiedad y a las pasiones mundanas, y a vivir sobria, justa y piadosamente en este mundo (2:11–12). La esperanza bendita es la aparición gloriosa de nuestro gran Dios y Salvador Jesucristo, que se dio a sí mismo por nosotros para redimirnos de toda iniquidad y purificar para sí un pueblo propio, celoso de buenas obras (2:13–14).</p>\n<p>El capítulo 3 recuerda que éramos insensatos, rebeldes, extraviados, esclavos de concupiscencias y deleites, viviendo en malicia y envidia, aborrecibles y aborreciendo a otros. Pero cuando se manifestó la bondad de Dios nuestro Salvador y su amor para con los hombres, no por obras de justicia que nosotros hubiéramos hecho, sino por su misericordia, nos salvó por el lavamiento de la regeneración y la renovación del Espíritu Santo (3:4–5). Justificados por su gracia, seamos herederos de la vida eterna (3:7). La exhortación final es a ocuparse en buenas obras y evitar contiendas y genealogías estériles (3:9). Rechaza al hombre herético después de una primera y segunda amonestación (3:10). Tito debe ir a Nicópolis y traer a Zenas y Apolos (3:12–13). La gracia sea con todos.</p>\n<p>Temas clave: Gracia, redención, liderazgo, buenas obras, regeneración, sana doctrina y comunidad.</p>",
  "Filemón": "<h3>Biografía — Filemón</h3>\n<p>Autor tradicional: Pablo. Fecha estimada: c. 60–62 d.C. Capítulos: 1. Género: Epístola personal.</p>\n<p>Filemón es la carta más breve de Pablo y una obra maestra de persuasión cristiana. Pablo escribe desde la prisión a Filemón, un cristiano de Colosas, cuyo esclavo Onésimo había huido a Roma y allí se había convertido por medio de Pablo. La carta no aborda directamente la institución de la esclavitud, pero transforma la relación: Pablo pide a Filemón que reciba a Onésimo no como esclavo, sino como &quot;hermano amado&quot; (16). Pablo ofrece pagar cualquier deuda de Onésimo con su propia cuenta (18–19), aunque le recuerda que le debe su propia vida (19). La carta es un modelo de intercesión, amor, justicia y redención. Incluye saludos a Apia (la esposa de Filemón), a Arquipo y a la iglesia en su casa. La gracia de Jesucristo sea con el espíritu de todos. Filemón es un texto fundacional para la ética cristiana y la relación interpersonal en el evangelio.</p>\n<p>Temas clave: Redención, intercesión, reconciliación, hermandad cristiana, justicia y amor.</p>",
  "Hebreos": "<h3>Biografía — Hebreos</h3>\n<p>Autor tradicional: Anónimo (debate: Pablo, Apolos, Bernabé, Priscila). Fecha estimada: c. 64–70 d.C. Capítulos: 13. Género: Sermón/tractado teológico.</p>\n<p>Hebreos es una exhortación sofisticada a judíos cristianos para que no abandonen la fe. El prólogo (1:1–4) presenta al Hijo como heredero de todas las cosas, por quien hizo el universo, el resplandor de la gloria y la imagen exacta de su sustancia. La superioridad del Hijo sobre los ángeles (1:5–2:18) se basa en la filiación divina y en su condescendencia humana para ser el sumo sacerdote misericordioso. &quot;Porque ciertamente no tomó a los ángeles, sino que tomó la descendencia de Abraham&quot; (2:16). Los capítulos 3–4 comparan a Jesús con Moisés y Josué, presentando el sábado espiritual: &quot;Entremos, pues, con confianza en el trono de la gracia, para alcanzar misericordia y hallar gracia para el oportuno socorro&quot; (4:16).</p>\n<p>El capítulo 5–7 presenta la superioridad del sacerdocio de Melquisedec sobre el de Aarón. Melquisedec, rey de Salem y sacerdote del Dios Altísimo, aparece sin genealogía, sin principio ni fin de días, hecho semejante al Hijo de Dios (7:3). Jesús es sacerdote &quot;según el orden de Melquisedec&quot; (6:20), con un juramento que el antiguo sacerdocio no tenía. El capítulo 8–10 desarrolla el nuevo pacto: la antigua sombra del bien venidero; el nuevo pacto con leyes escritas en el corazón, y el perdón de los pecados (8:7–13, citando Jeremías 31:31–34). El santuario terrenal es figura del celestial; Cristo entró una vez para siempre en el Lugar Santísimo con su propia sangre, obteniendo redención eterna (9:12). La sangre de Cristo limpia la conciencia de las obras muertas para servir al Dios vivo (9:14). El capítulo 10 es la cúspide: la voluntad de Dios se cumple en la ofrenda de Cristo; &quot;sacrificio por el pecado no ofreciste, pero un cuerpo me preparaste&quot; (10:5). Podemos entrar en el santuario por la sangre de Jesús, con corazón limpio y cuerpo lavado con agua pura (10:22). La exhortación a perseverar (10:19–39) incluye la advertencia terrible: &quot;¿De cuánto mayor castigo seréis juzgados dignos...?&quot; (10:29). &quot;Pero nosotros no somos de los que se vuelven atrás para perdición, sino de los que tienen fe para salvación del alma&quot; (10:39).</p>\n<p>Los capítulos 11–13 son la exhortación final. El &quot;salón de la fama de la fe&quot; (11:1–40) enumera los héroes del Antiguo Testamento: Abel, Enoc, Noé, Abraham, Sara, Isaac, Jacob, José, Moisés, la Pasqua, la travesía del Mar Rojo, la caída de los muros de Jericó, Rahab, Gedeón, Barac, Sansón, Jefté, David, Samuel, los profetas, &quot;que por fe vencieron reinos, hicieron justicia, alcanzaron promesas... de débiles fueron hechos fuertes&quot; (11:33–34). La nube de testigos (12:1) exhorta a despojarse de todo peso y del pecado que nos asedia, corriendo con paciencia la carrera, puesto los ojos en Jesús, el autor y consumador de la fe (12:1–2). El castigo disciplinario de Dios es amoroso (12:4–13). No se ha llegado al monte Sinaí, sino al monte Sion, a la ciudad del Dios vivo, a la Jerusalén celestial, a millones de ángeles, a la congregación de los primogénitos, a Dios juez de todos, a los espíritus de los justos hechos perfectos, y a Jesús, mediador del nuevo pacto (12:18–24). La exhortación final (13:1–25) incluye amor fraternal, hospitalidad, matrimonio, contentamiento, obediencia a los líderes, y la ofrenda perpetua de alabanza. &quot;Jesucristo es el mismo ayer, y hoy, y por los siglos&quot; (13:8). La sangre del pacto es eterna (13:20). La gracia sea con todos.</p>\n<p>Temas clave: Superioridad de Cristo, sacerdocio de Melquisedec, nuevo pacto, sacrificio único, fe, perseverancia y disciplina.</p>",
  "Santiago": "<h3>Biografía — Santiago</h3>\n<p>Autor tradicional: Santiago, hermano del Señor y líder de la iglesia de Jerusalén. Fecha estimada: c. 45–50 d.C. Capítulos: 5. Género: Epístola de sabiduría/ética.</p>\n<p>Santiago es una epístola de sabiduría práctica, similar a los Proverbios y la literatura sapiencial. El autor se identifica como &quot;siervo de Dios y del Señor Jesucristo, Santiago&quot; (1:1). El capítulo 1 exhorta a la prueba de la fe como ocasión de gozo, pues la prueba de la fe produce paciencia, y la paciencia tiene su obra completa para que seáis perfectos (1:2–4). Si alguno tiene falta de sabiduría, pídala a Dios que da a todos abundantemente y sin reproche (1:5). El que duda es como la onda del mar (1:6). El pobre debe gloriarse en su exaltación, el rico en su humillación (1:9–11). La prueba por la propia concupiscencia no viene de Dios, sino de la carne (1:13–15). Toda buena dádiva y todo don perfecto desciende del Padre de las luces, en quien no hay mudanza ni sombra de variación (1:17). Sed hacedores de la palabra, no tan solamente oidores (1:22–25). La religión pura y sin mácula es visitar a los huérfanos y a las viudas en sus tribulaciones, y guardarse sin mancha del mundo (1:27).</p>\n<p>El capítulo 2 trata la fe y las obras: &quot;La fe, si no tiene obras, es muerta en sí misma&quot; (2:17). Abraham ofreció a Isaac sobre el altar, y la fe se completó con las obras (2:21–22). Así también Rahab la ramera fue justificada por las obras cuando recibió a los mensajeros y los envió por otro camino (2:25). &quot;Como el cuerpo sin espíritu está muerto, así también la fe sin obras es muerta&quot; (2:26). El capítulo 3 enseña sobre la lengua: es un pequeño miembro pero se gloría de grandes cosas. La lengua es un fuego, un mundo de maldad, que contamina todo el cuerpo (3:6). Con la lengua bendecimos a Dios y maldecimos a los hombres hechos a su imagen (3:9). La sabiduría que viene de arriba es pura, pacífica, amable, benigna, llena de misericordia y buenos frutos (3:17). El capítulo 4 trata las guerras y contiendas de las concupiscencias, la amistad del mundo como enemistad con Dios, la soberbia, la confianza en los planes humanos (&quot;Hoy y mañana iremos a tal ciudad...&quot;) y la necesidad de sometimiento a Dios: &quot;Resistid al diablo, y huirá de vosotros&quot; (4:7). El capítulo 5 denuncia a los ricos que acumulan riquezas podridas, han defraudado los jornales de los obreros, y viven en placeres y deleites. La paciencia de los labradores esperando la lluvia temprana y tardía es modelo de la paciencia para la venida del Señor (5:7). No os juréis ni por el cielo ni por la tierra (5:12). La oración de fe salvará al enfermo, y el Señor lo levantará (5:15). El que haya hecho errar al justo deberá volver a traerle (5:19–20). La gracia sea con todos.</p>\n<p>Temas clave: Fe y obras, sabiduría práctica, lengua, riqueza, oración, paciencia y justicia social.</p>",
  "1 Pedro": "<h3>Biografía — 1 Pedro</h3>\n<p>Autor tradicional: Pedro, apóstol. Fecha estimada: c. 60–64 d.C. Capítulos: 5. Género: Epístola general.</p>\n<p>1 Pedro es una carta de consuelo y exhortación a cristianos que sufren persecución en el imperio romano. Los destinatarios son judíos cristianos dispersos en el Ponto, Galacia, Capadocia, Asia y Bitinia (1:1). La elección según la presciencia del Padre, la santificación por el Espíritu, y la aspersión de la sangre de Jesucristo (1:2) establecen la identidad. La herencia incorruptible, incontaminada e inmarchitable está guardada en los cielos (1:4). Aunque ahora tengáis que ser afligidos por diversas pruebas, para que sea hallada genuina vuestra fe (1:6–7). Los profetas del Antiguo Testamento inquirieron y escudriñaron acerca de la gracia destinada a vosotros (1:10–12). Sed santos, como santo es aquel que os llamó (1:15–16). La redención no fue con oro corruptible, sino con la sangre preciosa de Cristo (1:18–19).</p>\n<p>El capítulo 2 describe a los creyentes como piedras vivas edificadas sobre la piedra angular (Cristo), para ser casa espiritual y sacerdocio santo (2:4–5). &quot;He aquí, pongo en Sion una piedra principal de esquina, escogida, preciosa; y el que crea en él, no será avergonzado&quot; (2:6). Vosotros sois linaje escogido, real sacerdocio, nación santa, pueblo adquirido para proclamar las virtudes de aquel que os llamó de las tinieblas a su luz admirable (2:9). Sométanse a toda institución humana por amor al Señor (2:13). Los siervos, sometáos a vuestros amos, no sólo a los buenos y moderados, sino también a los difíciles de soportar (2:18). Cristo padeció por nosotros, dejándonos ejemplo para que sigáis sus pasos (2:21). El capítulo 3 trata a las esposas y esposos, la santidad, la esperanza y la defensa de la fe. &quot;Antes bien, santificad a Dios el Señor en vuestros corazones, y estad siempre preparados para responder a todo el que os demande razón de la esperanza que hay en vosotros&quot; (3:15). El capítulo 4 exhorta a la armonía, la hospitalidad, el uso de los dones, y la alegría en el sufrimiento por el nombre de Cristo (4:12–19). El capítulo 5 instruye a los ancianos del rebaño, no por fuerza, sino voluntariamente; no por ganancia deshonesta, sino con ánimo pronto; no como teniendo señorío sobre los que están a vuestro cuidado, sino siendo ejemplos del rebaño (5:2–3). El diablo, como león rugiente, anda buscando a quien devorar (5:8). Resistid firmes en la fe (5:9). La gracia sea con todos.</p>\n<p>Temas clave: Sufrimiento, esperanza, sacerdocio real, sumisión, Cristo ejemplo, defensa de la fe y humildad.</p>",
  "2 Pedro": "<h3>Biografía — 2 Pedro</h3>\n<p>Autor tradicional: Pedro, apóstol. Fecha estimada: c. 64–68 d.C. Capítulos: 3. Género: Epístola general/escatológica.</p>\n<p>2 Pedro es una carta de advertencia contra los falsos maestros y una afirmación de la venida de Cristo. El capítulo 1 recuerda la fe preciosa por igualidad, y la gracia y la paz multiplicadas por el conocimiento de Dios y de Jesús nuestro Señor (1:2). Mediante su divino poder nos ha dado todo lo que pertenece a la vida y a la piedad (1:3). Por esto mismo, haciendo todo esfuerzo, añadid a vuestra fe virtud, a la virtud conocimiento, al conocimiento dominio propio, al dominio propio paciencia, a la paciencia piedad, a la piedad afecto fraternal, y al afecto fraternal amor (1:5–7). El que hace estas cosas no caerá jamás (1:10). El capítulo 1:16–21 defiende la transfiguración como experiencia visual real, no fábula: &quot;Porque no os hemos dado a conocer el poder y la venida de nuestro Señor Jesucristo siguiendo fábulas artificiales, sino como habiendo visto con nuestros propios ojos su majestad&quot; (1:16). La profecía de la Escritura no es de interpretación privada, sino que los hombres santos de Dios hablaron siendo inspirados por el Espíritu Santo (1:21).</p>\n<p>El capítulo 2 describe a los falsos maestros que traerán herejías destructivas, negando al Señor que los rescató (2:1). El juicio sobre ellos es seguro: los ángeles que pecaron fueron arrojados al infierno; el mundo antiguo fue destruido con agua; Sodoma y Gomorra fueron reducidas a ceniza (2:4–9). Estos impíos, criaturas irracionales, maldicen las cosas que no entienden, y serán destruidos en su propia corrupción (2:12). Han dejado el camino recto, andando tras la vía de Balaam (2:15). El capítulo 3 trata la escatología: los escarnecedores vendrán en los postreros días, diciendo: &quot;¿Dónde está la promesa de su venida?&quot; (3:3–4). El cielo y la tierra existen ahora por la palabra de Dios, reservados para el fuego (3:7). Para el Señor un día es como mil años, y mil años como un día (3:8). El Señor no retarda su promesa, sino que es paciente para con nosotros, no queriendo que ninguno perezca, sino que todos procedan al arrepentimiento (3:9). El día del Señor vendrá como ladrón en la noche; los cielos pasarán con grande estruendo, y los elementos ardiendo serán deshechos, y la tierra y las obras que en ella hay serán quemadas (3:10). Pero nosotros, según su promesa, esperamos cielos nuevos y tierra nueva, en los cuales mora la justicia (3:13). Acrecentad, pues, en la santidad y en la piedad (3:11). La gracia sea con todos.</p>\n<p>Temas clave: Conocimiento, virtud, transfiguración, falsos maestros, juicio, creación, escatología y paciencia divina.</p>",
  "1 Juan": "<h3>Biografía — 1 Juan</h3>\n<p>Autor tradicional: Juan, el discípulo amado. Fecha estimada: c. 85–95 d.C. Capítulos: 5. Género: Epístola general/teológica.</p>\n<p>1 Juan es un sermón cíclico sobre la vida, la luz y el amor. No tiene saludo formal ni nombres propios. El prólogo (1:1–4) presenta al Verbo de vida que era desde el principio, que oímos, que vimos con nuestros ojos, que contemplamos, y que palparamos con nuestras manos. Dios es luz, y no hay ningunas tinieblas en él (1:5). Si decimos que tenemos comunión con él, y andamos en tinieblas, mentimos (1:6). Si confesamos nuestros pecados, él es fiel y justo para perdonar (1:9). El capítulo 2 presenta a Cristo como abogado (parakletos) con el Padre, y como propiciación por nuestros pecados (2:1–2). El conocimiento de él que está desde el principio, el conocimiento del Padre, y el conocimiento del Hijo son bases de la comunidad. El amor al mundo (las concupiscencias de la carne, los ojos y la vida) es enemistad con el Padre (2:15–16). El anticristo ya viene, y hay muchos anticristos (2:18). El que niega al Padre y al Hijo es anticristo (2:22). Lo que habéis oído desde el principio, permanezca en vosotros (2:24). Su ungión os enseña acerca de todas las cosas (2:27).</p>\n<p>El capítulo 3 afirma que somos hijos de Dios, y aun no se ha manifestado lo que hemos de ser; pero sabemos que cuando él se manifieste, seremos semejantes a él (3:2). El que permanece en él no peca (3:6). El que practica el pecado es del diablo (3:8). El que no ama a su hermano, permanece en muerte (3:14). El que aborrece a su hermano es homicida (3:15). El amor se conoce en que Cristo puso su vida por nosotros; nosotros debemos poner nuestra vida por los hermanos (3:16). El amor no es de palabras, sino de hechos (3:18). Si nuestro corazón no nos reprende, confianza tenemos para con Dios (3:21). El capítulo 4 prueba a los espíritus: &quot;Todo espíritu que confiesa que Jesucristo ha venido en carne, es de Dios; y todo espíritu que no confiesa que Jesucristo ha venido en carne, no es de Dios&quot; (4:2–3). Nosotros le amamos a él, porque él nos amó primero (4:19). El que no ama a su hermano a quien ha visto, no puede amar a Dios a quien no ha visto (4:20). El capítulo 5 presenta la victoria de la fe: todo el que es nacido de Dios vence al mundo (5:4). El que cree que Jesús es el Hijo de Dios, es nacido de Dios (5:5). Testigos en el cielo: el Padre, la Palabra y el Espíritu Santo (5:7). Testigos en la tierra: el agua, la sangre y el Espíritu (5:8). El que tiene al Hijo, tiene la vida; el que no tiene al Hijo de Dios, no tiene la vida (5:12). Si sabemos que él nos oye, sabemos que tenemos las peticiones que le hayamos hecho (5:15). Hay pecado de muerte (5:16–17). Todo el que es nacido de Dios no practica el pecado (5:18). Sabemos que somos de Dios, y el mundo entero está bajo el maligno (5:19). El que conoce al Hijo de Dios, conoce también al Padre. La gracia sea con todos.</p>\n<p>Temas clave: Vida, luz, amor, pecado, anticristo, propiciación, ungión, fe y victoria.</p>",
  "2 Juan": "<h3>Biografía — 2 Juan</h3>\n<p>Autor tradicional: Juan, el anciano. Fecha estimada: c. 85–95 d.C. Capítulos: 1. Género: Epístola personal.</p>\n<p>2 Juan es una carta breve a la &quot;dama elegida y a sus hijos&quot;, probablemente una iglesia doméstica. Juan se regocija de hallar a algunos de sus hijos andando en la verdad (vers. 4). El mandamiento es el de siempre: amarnos unos a otros (vers. 5). El amor consiste en andar según sus mandamientos (vers. 6). La advertencia central es contra los engañadores que no confiesan que Jesucristo viene en carne: este es el engañador y el anticristo (vers. 7). Cuidado con perder el galardón (vers. 8). No recibáis en casa a quienes traen esta doctrina, ni les saludéis (vers. 10). El que les saluda, participa en sus malas obras (vers. 11). La carta cierra con la esperanza de visitar y hablar cara a cara, y la saludación de los hijos de tu hermana elegida (vers. 12–13).</p>\n<p>Temas clave: Verdad, amor, doctrina de Cristo, hospitalidad y anticristo.</p>",
  "3 Juan": "<h3>Biografía — 3 Juan</h3>\n<p>Autor tradicional: Juan, el anciano. Fecha estimada: c. 85–95 d.C. Capítulos: 1. Género: Epístola personal.</p>\n<p>3 Juan es una carta personal a Gayo, un amigo de Juan. Juan se regocija de que los hermanos den testimonio de la verdad que hay en él, y de que él ande en la verdad (vers. 3–4). La carta alaba a Gayo por su hospitalidad hacia los misioneros que viajan: &quot;Tú harás bien en enviarlos como es digno de la causa de Dios, porque por causa del Nombre salieron, sin aceptar nada de los gentiles&quot; (vers. 6–7). Por tanto, debemos recibir a los que son como ellos (vers. 8). El contraste es con Diótrefes, que ama tener el primado entre ellos, no recibe a los hermanos, y excomulga a los que lo hacen (vers. 9–10). Juan promete corregir esto personalmente. Demetrio tiene buen testimonio de todos, y de la verdad misma (vers. 12). La carta cierra con la esperanza de visitar pronto y la saludación de los amigos (vers. 13–14). 3 Juan es el único libro del Nuevo Testamento que no menciona a Dios ni a Jesucristo explícitamente (aunque &quot;el Nombre&quot; y &quot;la verdad&quot; lo implican).</p>\n<p>Temas clave: Hospitalidad, misiones, autoridad eclesial, verdad y testimonio.</p>",
  "Judas": "<h3>Biografía — Judas</h3>\n<p>Autor tradicional: Judas, hermano de Santiago y del Señor. Fecha estimada: c. 65–80 d.C. Capítulos: 1. Género: Epístola general/polemica.</p>\n<p>Judas es una carta breve y vehemente contra los falsos maestros. El autor se identifica como &quot;siervo de Jesucristo, y hermano de Santiago&quot; (vers. 1). La carta es para los que están santificados en Dios el Padre, guardados por Jesucristo, y llamados (vers. 1). Judas deseaba escribir sobre la salvación común, pero se ve obligado a exhortar a contender por la fe que ha sido una vez dada a los santos (vers. 3). Hay ciertos hombres que se han infiltrado, impíos, que convierten la gracia de Dios en libertinaje, y niegan a Jesucristo, único soberano y Señor nuestro (vers. 4). El juicio sobre ellos es seguro: los ángeles que no guardaron su dignidad fueron reservados en prisiones eternas; Sodoma y Gomorra fueron destruidas por fuego eterno (vers. 6–7). Estos soñadores contaminan la carne, desprecian la autoridad, y dicen injurias contra las potestades gloriosas (vers. 8). Micael, el arcángel, no se atrevió a pronunciar juicio blasfemo contra el diablo, sino que dijo: &quot;El Señor te reprenda&quot; (vers. 9). Son como estrellas errantes para quienes está reservada la oscuridad de las tinieblas para siempre (vers. 13). Enoc, el séptimo desde Adán, profetizó sobre estos: &quot;He aquí, viene el Señor con diez millares de sus santos, para ejecutar juicio contra todos&quot; (vers. 14–15). Son murmuradores, quejumbrosos, que andan según sus propios deseos; su boca habla cosas grandísimas, y admiran a las personas por causa del interés (vers. 16). Amados, edificaos sobre vuestra santísima fe, orando en el Espíritu Santo; guardaos en el amor de Dios, esperando la misericordia de nuestro Señor Jesucristo para vida eterna (vers. 20–21). A los que dudan, convencedlos; a los que están en el fuego, arrebatadlos; a los demás, tened misericordia con temor (vers. 22–23). Al único y sabio Dios, por medio de Jesucristo nuestro Señor, sea gloria y majestad, dominio y poder, antes de todos los tiempos, ahora, y por todos los siglos. Amén (vers. 25).</p>\n<p>Temas clave: Contender por la fe, falsos maestros, juicio, Enoch, arcángeles, edificación y gloria.</p>",
  "Apocalipsis": "<h3>Biografía — Apocalipsis</h3>\n<p>Autor tradicional: Juan, el discípulo amado. Fecha estimada: c. 95–96 d.C. Capítulos: 22. Género: Apocalipsis/profecía.</p>\n<p>Apocalipsis (hebreo Revelation, griego Apokálypsis) es la revelación de Jesucristo que Dios le dio para mostrar a sus siervos las cosas que deben suceder pronto (1:1). Escrita en la isla de Patmos, donde Juan estaba por la palabra de Dios y el testimonio de Jesucristo (1:9). La estructura es una serie de visiones, números y símbolos. El capítulo 1 describe al Hijo del Hombre entre los siete candeleros de oro, con vestidura hasta los pies, ceñido el pecho con un cinto de oro, cabellos blancos como la lana, ojos como llama de fuego, pies como bronce bruñido, y voz como de muchas aguas. Tiene en su diestra siete estrellas, y de su boca sale una espada aguda de dos filos; su rostro es como el sol cuando resplandece en su fuerza (1:12–16). El mandato es escribir las cosas que has visto, las que son, y las que han de ser después de estas (1:19).</p>\n<p>Las cartas a las siete iglesias de Asia (caps. 2–3) son diagnósticos pastoreles: Éfeso (amor perdido), Esmirna (persecución), Pérgamo (compromiso con el mundo), Tiatira (idolatría y inmoralidad), Sardis (muerta), Filadelfia (fidelidad), Laodicea (tibieza). El que venciere recibirá promesas específicas. El capítulo 4 describe el trono celestial con los 24 ancianos, los cuatro seres vivientes (león, becerro, rostro humano, águila) y la adoración continua. El capítulo 5 presenta el libro con siete sellos que nadie puede abrir, excepto el Cordero de Dios que fue inmolado y vive, con siete cuernos y siete ojos (5:6). Los capítulos 6–16 describen la apertura de los siete sellos, las siete trompetas y las siete copas. Los cuatro jinetes (conquista, guerra, hambruna y muerte, caballo pálido) son los sellos 1–4. El quinto sello es el clamor de las almas de los mártires (6:9–11). El sexto sello es el cataclismo cósmico (6:12–17). Los 144.000 sellados de Israel (7:1–8) y la gran multitud de todas las naciones (7:9–17) son la iglesia triunfante. La séptima trometa anuncia el reino de Dios y su Cristo (11:15).</p>\n<p>La visión de la mujer y el dragón (cap. 12): la mujer vestida de sol, con la luna bajo sus pies, y una corona de doce estrellas, da a luz al varón que ha de regir todas las naciones. El dragón (Satanás) intenta devorar al hijo, pero es arrojado al cielo. La bestia del mar (13:1–10) tiene siete cabezas y diez cuernos, y recibe poder del dragón. La bestia de la tierra (el falso profeta, 13:11–18) hace que la tierra adore a la primera bestia y marca con el número 666 (13:18). Los 144.000 en el monte Sion (14:1–5), los tres ángeles que proclaman el evangelio eterno (14:6–13), y la cosecha de la ira (14:14–20) preceden a las siete copas de la ira de Dios (caps. 15–16). Babilonia la Grande (caps. 17–18) es la prostituta sentada sobre la bestia escarlata, ebria de la sangre de los santos. Su caída es celebrada (18:1–24). El júbilo celestial (cap. 19) incluye la boda del Cordero (19:7–9) y la victoria del Jinete Fiel y Veraz sobre la bestia y el falso profeta (19:11–21). Los mil años (cap. 20): Satanás es encadenado, los mártires reina con Cristo, y luego Satanás es soltado para la batalla final de Gog y Magog. El juicio del gran tranco blanco (20:11–15) abre los libros; el que no se halló inscrito en el libro de la vida fue lanzado al lago de fuego.</p>\n<p>Los capítulos 21–22 describen la nueva creación: &quot;He aquí el tabernáculo de Dios con los hombres, y él habitará con ellos&quot; (21:3). La nueva Jerusalén desciende del cielo, como ataviada de esposa para su marido (21:2). La ciudad es cuadrada, de 12.000 estadios de longitud, ancho y alto, con doce puertas (nombres de las tribus) y doce cimientos (nombres de los apóstoles). No tiene necesidad de sol ni luna, porque la gloria de Dios la ilumina (21:23). El río de agua de vida procede del trono de Dios y del Cordero, y a cada lado del río está el árbol de la vida (22:1–2). &quot;He aquí, yo vengo pronto, y mi galardón conmigo, para recompensar a cada uno según sea su obra&quot; (22:12). El que da testimonio de estas cosas dice: Ciertamente vengo en breve. Amén; sí, ven, Señor Jesús (22:20). La gracia del Señor Jesucristo sea con todos los santos. Amén (22:21).</p>\n<p>Temas clave: Revelación, juicio, tribulación, redención, reino, nueva creación, esperanza y venida de Cristo.</p>"
};

async function loadBible() {
try {
const res =await fetch(BIBLE_URL);
if(!res.ok)throw new Error('No se pudo cargar la Biblia');
bible=await res.json();
// Normalizar nombres de los evangelios: el JSON original usa "S. Mateo", "S. Marcos", "S. Lucas", "S.Juan"
const nameFix= {
'S. Mateo': 'Mateo',
'S. Marcos': 'Marcos',
'S. Lucas': 'Lucas',
'S. Juan': 'Juan'
};
for(const [oldName,newName] of Object.entries(nameFix)) {
if(bible[oldName]) {
bible[newName] =bible[oldName];
delete bible[oldName];
}
}
// Normalizar Apocalipsis si tiene nombre alternativo en el JSON
for(const key of Object.keys(bible)) {
const lowerKey=key.toLowerCase().trim();
if((lowerKey.includes('apocalipsis') ||lowerKey.includes('revelación') ||lowerKey.includes('revelacion') ||lowerKey.includes('revelation') ||lowerKey.includes('apocalypse')) &&key!== 'Apocalipsis') {
bible['Apocalipsis'] =bible[key];
delete bible[key];
break;
}
}
books=bookOrder.filter(b =>bible[b]);
loading.style.display= 'none';
renderBooks();
initSidebarState();
const pos=loadPos();
if(pos&&bible[pos.book])goTo(pos.book,pos.chapter);
else goTo(books[0], 1);
} catch (e) {
loading.innerHTML= `<p style="color:#c44">Error al cargar: ${e.message}<br>Verifica tu conexión a Internet.</p>`;
}
}

function renderBooks() {
bookList.innerHTML= '';
const ot=books.slice(0, 39);
const nt=books.slice(39);
const filter=bookFilter.value.trim().toLowerCase();

function stripAccents(str) {
return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function addGroup(label,list) {
const normFilter=stripAccents(filter);
const filtered=filter?list.filter(b =>stripAccents(b.toLowerCase()).includes(normFilter)) :list;
if(!filtered.length)return;
const lbl=document.createElement('div');
lbl.className= 'book-group-label';
lbl.textContent=label;
bookList.appendChild(lbl);
filtered.forEach(b => {
const div=document.createElement('div');
div.className= 'book-item' + (b ===currentBook?' active' :'');
div.textContent= b;
div.onclick= () =>{goTo(b, 1);closeSidebarMobile(); };
bookList.appendChild(div);
});
}
addGroup('Antiguo Testamento',ot);
addGroup('Nuevo Testamento',nt);
}

function renderChapters() {
chapterBar.innerHTML= '';
if(!currentBook|| !bible[currentBook])return;
const chapters=Object.keys(bible[currentBook]).map(Number).sort((a, b) => a - b);
chapters.forEach(ch => {
const btn=document.createElement('button');
btn.className= 'chapter-tab' + (ch ===currentChapter?' active' :'');
btn.textContent= ch;
btn.onclick= () =>goTo(currentBook, ch);
chapterBar.appendChild(btn);
});
setTimeout(() => {
const active =chapterBar.querySelector('.chapter-tab.active');
if(active)active.scrollIntoView({behavior: 'smooth',inline: 'center', block: 'nearest' });
}, 50);
}

function goTo(book,chapter) {
if(!bible[book])return;
currentBook=book;
currentChapter=chapter;
const chData=bible[book][String(chapter)];
if(!chData)return;
const fullBookTitle = rvr1960BookTitles[book] || book;
contentTitle.innerHTML = `${fullBookTitle}<br><span style="display:block;font-size:0.65em;font-weight:500;color:var(--fg);opacity:0.75;margin-top:6px;font-family:var(--font-ui);">Capítulo ${chapter}</span>`;
currentTitle.textContent= `${book} ${chapter}`;
versesDiv.innerHTML= '';
// Mostrar botón para abrir la biografía en el capítulo 1 de cada libro
if (currentChapter === 1 && bookBios[currentBook]) {
  const bioBtn = document.createElement('button');
  bioBtn.className = 'bio-btn';
  bioBtn.innerHTML = '📖 Ver biografía del libro';
  bioBtn.onclick = () => openBioModal(currentBook);
  versesDiv.appendChild(bioBtn);
}
Object.keys(chData).map(Number).sort((a, b) => a - b).forEach(v => {
const p =document.createElement('p');
p.className= 'verse';
p.innerHTML= `<span class="verse-num">${v}</span>${chData[String(v)]}`;
versesDiv.appendChild(p);
});

renderChapters();
updateNav();

prevBtn.style.display= '';
nextBtn.style.display= '';
mobileBackBtn.classList.remove('visible');
document.getElementById('content').scrollTop= 0;
closeSidebarMobile();
}

function updateNav() {
const bookIdx=books.indexOf(currentBook);
const chapters=Object.keys(bible[currentBook]).map(Number).sort((a, b) => a - b);
const chIdx=chapters.indexOf(currentChapter);
prevBtn.disabled= (bookIdx=== 0 &&chIdx=== 0);
nextBtn.disabled= (bookIdx===books.length- 1 &&chIdx===chapters.length- 1);
}

function prevChapter() {
const chapters=Object.keys(bible[currentBook]).map(Number).sort((a, b) => a - b);
const chIdx=chapters.indexOf(currentChapter);
if(chIdx> 0)goTo(currentBook,chapters[chIdx- 1]);
else{
const bIdx=books.indexOf(currentBook);
if(bIdx> 0) {
const prevBook=books[bIdx- 1];
const prevChs=Object.keys(bible[prevBook]).map(Number).sort((a, b) => a - b);
goTo(prevBook,prevChs[prevChs.length- 1]);
}
}
}
function nextChapter() {
const chapters=Object.keys(bible[currentBook]).map(Number).sort((a, b) => a - b);
const chIdx=chapters.indexOf(currentChapter);
if(chIdx<chapters.length- 1)goTo(currentBook,chapters[chIdx+ 1]);
else{
const bIdx=books.indexOf(currentBook);
if(bIdx<books.length- 1)goTo(books[bIdx+ 1], 1);
}
}

function normalizeBookInput(input) {
return input.toLowerCase().replace(/^s\.?\s*/, '').trim();
}

function parseReference(q) {
const refMatch=q.match(/^(.*?)\s+(\d+)(?::(\d+))?$/);
if(!refMatch)return null;
const bookPart=normalizeBookInput(refMatch[1]);
const chapter=parseInt(refMatch[2]);
const verse =refMatch[3] ?parseInt(refMatch[3]) :null;
if(!bookPart)return null;

let book=books.find(b =>normalizeBookInput(b) ===bookPart);
if(!book) {
const candidates =books.filter(b => {
const nb=normalizeBookInput(b);
return nb.startsWith(bookPart+ ' ') ||bookPart.startsWith(nb+ ' ');
});
if(candidates.length) {
candidates.sort((a, b) =>normalizeBookInput(b).length-normalizeBookInput(a).length);
book=candidates[0];
}
}
if(!book|| !bible[book][String(chapter)])return null;
return{book,chapter,verse };
}

function doSearch() {
const q =searchInput.value.trim().toLowerCase();
searchInput.value= '';
if(!q)return;
const ref=parseReference(q);
if(ref) {
goTo(ref.book,ref.chapter);
if(ref.verse) {
setTimeout(() => {
const nums=document.querySelectorAll('.verse-num');
nums.forEach(n =>{if(n.textContent==ref.verse)n.scrollIntoView({behavior: 'smooth', block: 'center' }); });
}, 100);
}
return;
}
contentTitle.textContent= `Resultados: "${q}"`;
currentTitle.textContent= 'Búsqueda';
versesDiv.innerHTML= '';
let count= 0;
for(const book of books) {
for(const chStr of Object.keys(bible[book]).sort((a, b) => Number(a) - Number(b))) {
const ch = Number(chStr);
for(const vStr of Object.keys(bible[book][chStr]).sort((a, b) => Number(a) - Number(b))) {
const v = Number(vStr);
const text=bible[book][chStr][vStr].toLowerCase();
if(text.includes(q)) {
count++;
const div=document.createElement('div');
div.className= 'search-result';
const highlighted=bible[book][chStr][vStr].replace(new RegExp(`(${q})`, 'gi'), '<span class="verse-highlight">$1</span>');
div.innerHTML= `<div class="search-ref">${book} ${ch}:${v}</div><div class="search-snippet">${highlighted}</div>`;
div.onclick= () =>{goTo(book, ch); };
versesDiv.appendChild(div);
if(count>= 100) break;
}
}
if(count>= 100) break;
}
if(count>= 100) break;
}
if(count=== 0)versesDiv.innerHTML= '<p style="opacity:.7">No se encontraron resultados.</p>';
chapterBar.innerHTML= '';
prevBtn.style.display= 'none';
nextBtn.style.display= 'none';
backBtn.style.display= '';
mobileBackBtn.classList.add('visible');
}

const bioModal = document.getElementById('bio-modal');
const bioModalBody = document.getElementById('bio-modal-body');
const bioModalClose = document.getElementById('bio-modal-close');

function openBioModal(book) {
  if (!bookBios[book]) return;
  bioModalBody.innerHTML = bookBios[book];
  bioModal.classList.add('visible');
  document.body.style.overflow = 'hidden';
}
function closeBioModal() {
  bioModal.classList.remove('visible');
  bioModalBody.innerHTML = '';
  document.body.style.overflow = '';
}

bioModalClose.onclick = closeBioModal;
bioModal.onclick = (e) => {
  if (e.target === bioModal) closeBioModal();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && bioModal.classList.contains('visible')) closeBioModal();
});

toggleSidebarBtn.onclick=toggleSidebar;
showSidebarBtn.onclick=toggleSidebar;
bookFilter.oninput=renderBooks;
prevBtn.onclick=prevChapter;
nextBtn.onclick=nextChapter;
backBtn.onclick= () =>{goTo(currentBook,currentChapter); };
searchBtn.onclick=doSearch;
searchInput.onkeydown= e =>{if(e.key=== 'Enter')doSearch(); };
themeBtn.onclick=toggleTheme;
fontFamilyBtn.onclick=cycleFontFamily;
mobileBackBtn.onclick= () =>{goTo(currentBook,currentChapter); };
document.addEventListener('keydown', e => {
if(e.target.tagName=== 'INPUT')return;
if(e.key=== 'ArrowLeft')prevChapter();
if(e.key=== 'ArrowRight')nextChapter();
});

initTheme();
initFont();
initFontFamily();
loadBible();
})();
</script>
